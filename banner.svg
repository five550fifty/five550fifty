    <text x="54" y="161" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-2" fill="#f2f5f1">Artem Bardyuk</text>
    <text x="58" y="211" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#b9c4cd">Python &amp; Web Development</text>
