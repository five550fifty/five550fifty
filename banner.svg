<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Artem Bardyuk — Python and Web Development</title>
  <desc id="desc">Dark graphite banner with lime accents, Artem's name and an abstract 550 monogram.</desc>
  <defs>
